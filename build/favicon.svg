<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- White background -->
  <rect width="64" height="64" rx="10" fill="white"/>

  <!-- Head outline (circuit face) -->
  <ellipse cx="32" cy="31" rx="18" ry="20" fill="none" stroke="#102348" stroke-width="2.5"/>

  <!-- Top antenna line -->
  <line x1="32" y1="11" x2="32" y2="5" stroke="#102348" stroke-width="2"/>
  <circle cx="32" cy="4" r="2" fill="#EA8E0A"/>

  <!-- Left ear circuit -->
  <line x1="14" y1="28" x2="9" y2="28" stroke="#102348" stroke-width="2"/>
  <circle cx="8" cy="28" r="2" fill="#EA8E0A"/>
  <line x1="14" y1="34" x2="9" y2="34" stroke="#102348" stroke-width="2"/>
  <circle cx="8" cy="34" r="2" fill="#EA8E0A"/>

  <!-- Right ear circuit -->
  <line x1="50" y1="28" x2="55" y2="28" stroke="#102348" stroke-width="2"/>
  <circle cx="56" cy="28" r="2" fill="#EA8E0A"/>
  <line x1="50" y1="34" x2="55" y2="34" stroke="#102348" stroke-width="2"/>
  <circle cx="56" cy="34" r="2" fill="#EA8E0A"/>

  <!-- Left eye -->
  <circle cx="25" cy="27" r="3" fill="none" stroke="#102348" stroke-width="2"/>
  <circle cx="25" cy="27" r="1.2" fill="#EA8E0A"/>

  <!-- Right eye -->
  <circle cx="39" cy="27" r="3" fill="none" stroke="#102348" stroke-width="2"/>
  <circle cx="39" cy="27" r="1.2" fill="#EA8E0A"/>

  <!-- Nose circuit line -->
  <line x1="32" y1="30" x2="32" y2="36" stroke="#102348" stroke-width="1.8"/>
  <circle cx="32" cy="36" r="1.5" fill="#EA8E0A"/>

  <!-- Mouth circuit -->
  <line x1="25" y1="40" x2="39" y2="40" stroke="#102348" stroke-width="2"/>
  <circle cx="25" cy="40" r="1.5" fill="#EA8E0A"/>
  <circle cx="32" cy="40" r="1.5" fill="#EA8E0A"/>
  <circle cx="39" cy="40" r="1.5" fill="#EA8E0A"/>

  <!-- Bottom circuit -->
  <line x1="28" y1="51" x2="28" y2="57" stroke="#102348" stroke-width="2"/>
  <line x1="36" y1="51" x2="36" y2="57" stroke="#102348" stroke-width="2"/>
  <circle cx="28" cy="58" r="2" fill="#EA8E0A"/>
  <circle cx="36" cy="58" r="2" fill="#EA8E0A"/>
</svg>
